; ============================================================
;  TS_SN_Generator - Einstellungen
;  Vor dem Start nur Text, Start und Ende anpassen.
; ============================================================

; Text vor der Nummer (Seriennummer = Text + Nummer, z. B. SN25)
Text = SN

; Erste und letzte Nummer (beide werden ausgegeben)
Start = 25
Ende  = 30

; ---- selten zu ändern ----------------------------------------

; Stellen der Nummer (2 -> SN07, 3 -> SN007)
Stellen = 2

; Name des Parameters in TopSolid, der die Seriennummer enthält
Parameter = Gravur2

; Ausgabeordner - am besten der Ordner, in den der Postprozessor speichert.
; Dort wird VOR dem Start geprüft, welche Nummern schon da sind (werden übersprungen).
; Ist es ein anderer Ordner, landet dort zusätzlich eine Kopie.
; Leer = nur PP-Ordner (Prüfung auf vorhandene Nummern dann erst ab der 2. Nummer).
Zielordner = Z:\NC\MASCHINE\_NEU_

; ja = nur die erste Nummer ausgeben (zum Ausprobieren)
Testlauf = nein
